services:
  phpcli:
    image: headgent/phpcli:${PHP_VERSION:-8.3}
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-0}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - APCU_SHM_SIZE=${APCU_SHM_SIZE:-64M}
      - OPCACHE_MEMORY_CONSUMPTION=${OPCACHE_MEMORY_CONSUMPTION:-128}
      - OPCACHE_MAX_ACCELERATED_FILES=${OPCACHE_MAX_ACCELERATED_FILES:-4000}
      - OPCACHE_REVALIDATE_FREQ=${OPCACHE_REVALIDATE_FREQ:-2}
      - PHP_ERROR_REPORTING=${PHP_ERROR_REPORTING:-"E_ALL & ~E_DEPRECATED & ~E_STRICT"}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-Off}
      - PHP_LOG_ERRORS=${PHP_LOG_ERRORS:-On}
      - XDEBUG_MODE=${XDEBUG_MODE:-debug}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-yes}
      - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
      - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
      - XDEBUG_LOG_LEVEL=${XDEBUG_LOG_LEVEL:-0}
    working_dir: /app
    volumes:
      - ../:/app
      # Temporary (P3, env-konfiguration): composer path-repository onto
      # contracts-develop so kernel QA runs against the unreleased Kernel
      # contract changes (projectRoot rename) before the bundled P4 release.
      # Remove together with composer.json's "repositories" entry before
      # that release.
      - ../../../support/contracts:/support/contracts:ro
    ports:
      - ${XDEBUG_CLIENT_PORT:-9003}:9003

  # R4 (env-konfiguration): real brokers for the messaging Integration suite
  # (development.md §5 — no test may assume manually started infrastructure).
  # Own container names and host ports throughout, distinct from
  # adapter/messaging's support/docker-compose.yml (redis 6380, rabbitmq
  # 5672/15672, kafka 9092) — the two suites must never run against each
  # other's brokers (L2). `make start` brings all three up; `make stop`
  # tears them down again.
  kernel-test-redis:
    image: redis:6.2-alpine
    container_name: kernel-test-redis
    ports:
      - "16381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kernel-test-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: kernel-test-rabbitmq
    ports:
      - "5674:5672" # AMQP
      - "16674:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kernel-test-kafka:
    image: apache/kafka:3.8.1
    container_name: kernel-test-kafka
    ports:
      - "19094:9092"
    environment:
      # Simplified single-node KRaft setup, ported from adapter/messaging's
      # compose (own advertised listener hostname, own cluster ID).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kernel-test-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kernel-test-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: N3JrZG1rZXJuZWx0ZXN0MQ
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
